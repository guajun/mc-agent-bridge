[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-agent-bridge"
version = "0.3.0"
description = "Agent-agnostic Minecraft bridge: mod protocol client, local API, MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["mcp>=1.0"]

[project.scripts]
mc-bridge = "mc_agent_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
