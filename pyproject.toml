[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-agent-bridge"
version = "0.4.1"
description = "Harness-neutral Minecraft Toolkit: server-vantage mod client, loopback API, CLI and MCP surface."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
mc-bridge = "mc_agent_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
