name: Go runtime

on:
  push:
    branches: ["main", "codex/**"]
    paths:
      - "go/**"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "go/**"
      - ".github/workflows/go.yml"

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: go version
        run: go version
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: unit tests
        run: go test ./...
      - name: clean-checkout CLI build and smoke
        run: |
          go build -o mc-agent ./cmd/mc-agent
          go run ./cmd/mc-agent version
      - name: race (linux)
        if: runner.os == 'Linux'
        run: go test -race ./...
