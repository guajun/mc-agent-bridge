name: release publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: resolve the reviewed tag commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: resolve the release tag
        id: resolve
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          [ -n "$TAG" ] || { echo "no release tag was provided" >&2; exit 1; }
          git fetch --force --tags origin
          git fetch origin main
          git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1 || { echo "tag $TAG does not exist" >&2; exit 1; }
          SHA="$(git rev-parse "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor "$SHA" origin/main || {
            echo "tag $TAG ($SHA) is not reachable from origin/main" >&2
            exit 1
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  release-build:
    name: stage and verify release assets
    needs: resolve
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      ref: ${{ needs.resolve.outputs.sha }}

  publish:
    name: publish GitHub release
    needs: [resolve, release-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: mc-agent-release-assets
          path: dist
          merge-multiple: true
      - name: verify source provenance
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          [ "$HEAD_SHA" = "$EXPECTED_SHA" ] || { echo "checkout $HEAD_SHA != resolved $EXPECTED_SHA" >&2; exit 1; }
          python - "$EXPECTED_SHA" <<'PY'
          import json, sys
          expected = sys.argv[1]
          info = json.load(open("dist/version.json"))
          actual = info["build"]["commit"]
          if actual != expected:
              raise SystemExit(f"version.json build.commit {actual} != {expected}")
          print(f"provenance ok: {actual}")
          PY
      - name: write release notes
        shell: bash
        env:
          VERSION: ${{ needs.release-build.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          mc-agent ${VERSION} - Go CLI/daemon for the Minecraft Agent Toolkit.

          One binary, no Python runtime and no MCP. Pair it with the
          mc-agent-interface Fabric mod 0.8.0+ on Minecraft 26.2
          (Fabric loader 0.19.5, Fabric API 0.161.0, Java 25).

          Assets: per-platform archives (binary only), checksums.txt,
          version.json (product / control protocol / compatibility / hashes) and
          the Toolkit Skill bundle built from the pinned mc-agent commit in
          skill-pin.json.

          Verify and install:

          \`\`\`bash
          # Linux amd64 / macOS arm64
          curl -fsSL https://raw.githubusercontent.com/guajun/mc-agent-bridge/${TAG}/install/install.sh \\
              | sh -s -- --version ${VERSION} --skill-harness codex
          \`\`\`

          \`\`\`powershell
          # Windows amd64
          iwr -useb https://raw.githubusercontent.com/guajun/mc-agent-bridge/${TAG}/install/install.ps1 -OutFile install.ps1
          ./install.ps1 -Version ${VERSION} -SkillHarness codex
          \`\`\`

          Supported and tested: Windows amd64, Linux glibc amd64, macOS arm64.
          Other platforms and Minecraft-aware proxies are unsupported; see
          docs/release.md in the repository for the exact boundary.

          Every asset was built and install-verified by the release workflow on
          its advertised runner.
          EOF
      - name: create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            dist/*
